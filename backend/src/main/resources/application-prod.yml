spring:
  datasource:
    # Runtime (JPA/Hikari) — precisa ser cotacao_app (sem BYPASSRLS). Ver comentário
    # equivalente em application-dev.yml.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    # Conexão admin, só para migrations — mantém DB_USER/DB_PASSWORD como estavam.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    clean-disabled: true
    placeholders:
      app_db_password: ${APP_DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cors:
    # Sem default (SecurityConfig) — boot falha se não setar. Comma-separated,
    # ex: "https://app.prx.com.br".
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  cookie:
    secure: true
  whatsapp:
    # Sem defaults de propósito — boot falha explicitamente se a Meta não estiver
    # configurada, em vez de subir com webhook mal-configurado silenciosamente
    # (mesmo padrão de JWT_SECRET/APP_CORS_ALLOWED_ORIGINS acima).
    verify-token: ${WHATSAPP_VERIFY_TOKEN}
    app-secret: ${WHATSAPP_APP_SECRET}
    access-token: ${WHATSAPP_ACCESS_TOKEN}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
    graph-api-base-url: https://graph.facebook.com/v20.0
    envio-habilitado: true

logging:
  level:
    root: WARN
    com.prx.cotacao: INFO
