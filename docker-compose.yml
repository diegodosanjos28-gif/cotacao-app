services:
  db:
    image: postgres:16-alpine
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: ${DB_NAME:-cotacao_dev}
      POSTGRES_USER: ${DB_USER:-cotacao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cotacao}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cotacao} -d ${DB_NAME:-cotacao_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ports removed — only Caddy talks to this now
    environment:
      TZ: America/Sao_Paulo
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cotacao_dev}
      DB_USER: ${DB_USER:-cotacao}
      DB_PASSWORD: ${DB_PASSWORD:-cotacao}
      APP_DB_USER: ${APP_DB_USER:-cotacao_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-cotacao_app_dev}
      JWT_SECRET: ${JWT_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ENVIO_HABILITADO: ${WHATSAPP_ENVIO_HABILITADO:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    # ports removed — only Caddy talks to this now
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
